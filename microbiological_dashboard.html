.cat-0 .cat-badge{background:#ffe0e0;color:#c0392b}
.cat-1 .cat-badge{background:#dbeafe;color:#1e40af}

.org-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.org-header h2{font-size:17px;font-weight:700;color:#1a1a2e}

.ab-table{width:100%;border-collapse:collapse;font-size:13px}
.ab-table th{text-align:left;padding:8px 10px;background:#f8f9fa;border-bottom:2px solid #e0e0e0;font-weight:700;color:#555;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.ab-table td{padding:6px 10px;border-bottom:1px solid #f0f0f0}
.ab-table tr:hover{background:#f8f9ff}
.ab-name{font-weight:600;max-width:220px}
.bar-cell{position:relative;width:160px;min-width:160px}
.bar-bg{height:18px;border-radius:4px;display:flex;overflow:hidden;background:#f0f0f0}
.bar-s{background:#2ecc71;height:100%}
.bar-i{background:#f39c12;height:100%}
.bar-r{background:#e74c3c;height:100%}
.pct-r{font-weight:700;text-align:right;min-width:45px}
.pct-r.low{color:#27ae60}
.pct-r.med{color:#e67e22}
.pct-r.high{color:#e74c3c}
.pct-r.crit{color:#c0392b;font-size:14px}

.sir-detail{font-size:11px;color:#999}
.legend{display:flex;gap:16px;margin:16px 0 20px;font-size:12px;color:#666}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{width:12px;height:12px;border-radius:3px}
.print-btn{background:#0f3460;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;font-size:13px;transition:background .2s}
.print-btn:hover{background:#1a4a8a}
.no-data{color:#ccc;font-style:italic;padding:20px;text-align:center}
@media print{

@media(max-width:768px){

const deptSelect = document.getElementById('deptSelect');
const content = document.getElementById('content');

document.getElementById('dateRange').textContent = 'Период: ' + DATA.dateRange.min + ' г. \u2014 ' + DATA.dateRange.max + ' г.';
document.getElementById('totalIsolates').textContent = DATA.totalIsolates.toLocaleString('ru');

let totalDepts = 0;
const deptIndex = {};

DATA.categories.forEach((cat, ci) => {
  const og = document.createElement('optgroup');
  og.label = cat.name;
  Object.keys(cat.departments).forEach(dName => {
    totalDepts++;
    const key = ci + '::' + dName;
    deptIndex[key] = {catIdx: ci, catName: cat.name, deptName: dName, data: cat.departments[dName]};
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = dName + ' (n=' + cat.departments[dName].total + ')';
    og.appendChild(opt);
  });
  deptSelect.appendChild(og);
});

function getPctClass(pct) {
  if (pct < 10) return 'low';
  if (pct < 30) return 'med';
  if (pct < 50) return 'high';
  return 'crit';
}

function renderDept(key) {
  const info = deptIndex[key];
  if (!info) { content.innerHTML = '<div class="no-data">Нет данных</div>'; return; }
  const dept = info.data;

  let html = '<div class="dept-info">' +
    '<div class="dept-card cat-' + info.catIdx + '"><h3>Отделение</h3><div style="font-size:17px;font-weight:700">' + info.deptName + '</div><div class="cat-badge">' + info.catName + '</div></div>' +
    '<div class="dept-card"><h3>Всего изолятов</h3><div class="big">' + dept.total.toLocaleString('ru') + '</div></div>' +
    '<div class="dept-card"><h3>Групп микроорганизмов</h3><div class="big">' + Object.keys(dept.organisms).length + '</div></div>' +
    '</div>' +
    '<div class="legend">' +
    '<span><div class="dot" style="background:#2ecc71"></div> S \u2014 чувствительный</span>' +
    '<span><div class="dot" style="background:#f39c12"></div> I \u2014 чувствительный при увеличенной экспозиции АМП</span>' +
    '<span><div class="dot" style="background:#e74c3c"></div> R \u2014 устойчивый</span>' +
    '</div>';

  const sortedOrgs = Object.entries(dept.organisms).sort((a, b) => b[1].total - a[1].total);

  for (const [orgName, orgData] of sortedOrgs) {
    const orgPct = (orgData.total / dept.total * 100).toFixed(1);
    const speciesHtml = orgData.species.map(s => '<span>' + s.name + ' (' + s.count + ')</span>').join(' ');

    const abEntries = Object.entries(orgData.resistance).sort((a, b) => (a[1].R / a[1].total) - (b[1].R / b[1].total));

    let rows = '';
    for (const [abName, c] of abEntries) {
      const t = c.total;
      const pS = c.S / t * 100, pI = c.I / t * 100, pR = c.R / t * 100;
      rows += '<tr><td class="ab-name">' + abName + '</td>' +
        '<td class="pct-r ' + getPctClass(pR) + '">' + pR.toFixed(0) + '%</td>' +
        '<td class="bar-cell"><div class="bar-bg">' +
        '<div class="bar-s" style="width:' + pS + '%"></div>' +
        '<div class="bar-i" style="width:' + pI + '%"></div>' +
        '<div class="bar-r" style="width:' + pR + '%"></div>' +
        '</div></td>' +
        '<td class="sir-detail">' + c.S + '/' + c.I + '/' + c.R + '</td>' +
        '<td class="n-tested">n=' + t + '</td></tr>';
    }

    html += '<div class="org-section">' +
      '<div class="org-header"><h2>' + orgName + '</h2><span class="count">n = ' + orgData.total + ' (' + orgPct + '%)</span></div>' +
      '<div class="species-list">' + speciesHtml + '</div>' +
      (abEntries.length ?
        '<table class="ab-table"><thead><tr><th>Антимикробный препарат</th><th>%R</th><th>S / I / R</th><th>S/I/R</th><th>Тест.</th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<div class="no-data">Нет данных о чувствительности</div>') +
      '</div>';
  }

  content.innerHTML = html;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

deptSelect.addEventListener('change', () => renderDept(deptSelect.value));
const firstKey = Object.keys(deptIndex)[0];
if (firstKey) renderDept(firstKey);
</script>
